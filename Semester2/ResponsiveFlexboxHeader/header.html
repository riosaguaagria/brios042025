<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
    <style>
        /* Mobile First Design */
        #pageheader {
            background-color: antiquewhite;
        }
        #logo {
            width: 100px;
            height: 100px;
            background-color: rgb(227, 140, 25);
            border-radius: 50%;
            border: 2px solid brown;
            margin: auto;
        }
        #pageheader nav {
            background-color: rgb(244, 184, 104);
        }
    </style>
</head>
<body>
    <header id="pageheader">
        <div id="logo"></div>
        <nav>
            <ul>
                <li>Home</li>
                <li>Why Adopt</li>
                <li>Pet Gallery</li>
                <li>Testimonials</li>
            </ul>
        </nav>
    </header>
</body>
</html>
